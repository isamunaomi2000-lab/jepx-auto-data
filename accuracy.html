<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JEPX 予測精度の比較</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 18px;
  background: #f3f6fa;
  color: #1e293b;
  font-family: sans-serif;
}
main { max-width: 760px; margin: auto; }
h1 { font-size: 24px; }
.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin: 15px 0;
}
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.value {
  font-size: 25px;
  font-weight: bold;
  margin: 10px 0;
}
.blue { color: #2563eb; }
.green { color: #16a34a; }
small { color: #64748b; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
th, td {
  padding: 10px 5px;
  border-bottom: 1px solid #e2e8f0;
  text-align: center;
}
th { background: #f8fafc; }
.scroll { overflow-x: auto; }
a { color: #2563eb; }
</style>
</head>
<body>
<main>
<a href="./">← トップページに戻る</a>
<h1>JEPX 東京エリア 予測精度</h1>
<p>従来予測と東電PG連動予測を実績価格と比較します。</p>

<div class="card">
  <h2>平均予測誤差（MAE）</h2>
  <div class="grid">
    <div>
      <small>従来予測</small>
      <div id="base" class="value blue">--</div>
    </div>
    <div>
      <small>東電PG連動</small>
      <div id="tepco" class="value green">--</div>
    </div>
  </div>
  <small>単位：円/kWh。小さいほど正確です。</small>
</div>

<div class="card">
  <h2>日別の勝敗</h2>
  <p id="wins">集計待ち</p>
  <p id="status">データを読み込み中...</p>
</div>

<div class="card">
  <h2>日別の比較結果</h2>
  <div class="scroll">
    <table>
      <thead>
        <tr>
          <th>日付</th>
          <th>従来MAE</th>
          <th>東電MAE</th>
          <th>勝者</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<small>東電PG連動予測は試験モデルです。精度改善は検証中です。</small>
</main>

<script>
function show(value) {
  return value == null ? "--" : Number(value).toFixed(3);
}

function winnerName(winner) {
  if (winner === "baseline") return "従来";
  if (winner === "tepco") return "東電PG";
  if (winner === "tie") return "引き分け";
  return "比較待ち";
}

async function load() {
  const status = document.getElementById("status");

  try {
    const response = await fetch(
      "data/evaluation/summary.json?v=" + Date.now(),
      { cache: "no-store" }
    );
    if (!response.ok) throw new Error("データ未公開");

    const data = await response.json();

    document.getElementById("base").textContent =
      show(data.average_baseline_mae_yen_kwh);

    document.getElementById("tepco").textContent =
      show(data.average_tepco_mae_yen_kwh);

    document.getElementById("wins").textContent =
      "従来 " + (data.baseline_wins || 0) +
      "勝 / 東電PG " + (data.tepco_wins || 0) +
      "勝 / 引き分け " + (data.ties || 0);

    const results = data.daily_results || [];
    const compared = data.compared_days || 0;

    status.textContent = compared > 0
      ? compared + "日分の比較結果を表示しています"
      : "実績待ち：比較できるデータがまだありません";

    const tbody = document.getElementById("rows");
    tbody.textContent = "";

    for (const row of [...results].reverse()) {
      const tr = document.createElement("tr");
      const cells = [
        row.date,
        show(row.mae_yen_kwh),
        show(row.tepco_mae_yen_kwh),
        winnerName(row.winner)
      ];
      for (const value of cells) {
        const td = document.createElement("td");
        td.textContent = value;
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
  } catch (error) {
    status.textContent =
      "評価データを取得できません。公開処理を確認してください。";
  }
}

load();
</script>
</body>
</html>
