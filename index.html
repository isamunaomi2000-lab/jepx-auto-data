<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JEPX 東京エリア価格予測</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: sans-serif;
  background: #f3f6fa;
  padding: 20px;
  text-align: center;
  color: #1e293b;
}
main {
  max-width: 650px;
  margin: 30px auto;
  padding: 25px;
  background: white;
  border-radius: 16px;
}
a.button {
  display: block;
  padding: 17px 12px;
  margin-top: 15px;
  color: white;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
}
.blue { background: #2563eb; }
.green { background: #16a34a; }
.orange { background: #ea580c; }
.hidden { display: none !important; }
.note { color: #64748b; font-size: 13px; }
</style>
</head>
<body>
<main>
<h1>JEPX 東京エリア価格予測</h1>
<p>最新の価格予測と予測精度を確認できます。</p>
<p id="status">最新データを確認中...</p>

<a id="base" class="button blue hidden" href="#">
従来予測グラフを見る
</a>

<a id="comparison" class="button green hidden" href="#">
東電PG連動・3本比較グラフを見る
</a>

<a class="button orange" href="accuracy.html">
予測精度・勝敗を見る
</a>

<p class="note">
実績価格は公開後に反映されます。<br>
東電PG連動予測は試験モデルです。
</p>
</main>

<script>
function japanDate(offset) {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const values = Object.fromEntries(
    parts.map(p => [p.type, p.value])
  );

  const date = new Date(Date.UTC(
    Number(values.year),
    Number(values.month) - 1,
    Number(values.day) + offset
  ));

  return date.toISOString().slice(0, 10);
}

async function findLatest(folder) {
  for (let offset = 1; offset >= -14; offset--) {
    const date = japanDate(offset);
    const url = folder + "/" + date + ".html";

    try {
      const response = await fetch(url, {
        method: "HEAD",
        cache: "no-store"
      });

      if (response.ok) return url;
    } catch (error) {
      console.log("Checking:", url);
    }
  }
  return null;
}

async function main() {
  const [base, comparison] = await Promise.all([
    findLatest("data/charts"),
    findLatest("data/comparison")
  ]);

  if (base) {
    const link = document.getElementById("base");
    link.href = base;
    link.classList.remove("hidden");
  }

  if (comparison) {
    const link = document.getElementById("comparison");
    link.href = comparison;
    link.classList.remove("hidden");
  }

  document.getElementById("status").textContent =
    base || comparison
      ? "最新のグラフを表示できます"
      : "グラフは現在準備中です";
}

main();
</script>
</body>
</html>
