
name: JEPX Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '10 22 * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download JEPX data
        run: python scripts/fetch_jepx.py
