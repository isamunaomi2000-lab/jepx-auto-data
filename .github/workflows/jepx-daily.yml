
name: JEPX Daily

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jepx-daily.yml'
      - 'scripts/fetch_jepx.py'
  schedule:
    - cron: '50 21 * * *'

concurrency:
  group: jepx-daily-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download JEPX data
        run: python scripts/fetch_jepx.py
      - name: Save verified JEPX results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/daily_summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified JEPX data"
            git pull --rebase
            git push
          fi
