name: JEPX Comparison Chart

on:
  workflow_dispatch:
  schedule:
    - cron: '50 23 * * *'

permissions:
  contents: write

jobs:
  comparison:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create comparison charts
        run: python scripts/create_comparison_chart.py

      - name: Commit comparison charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/comparison/
          if ! git diff --cached --quiet; then
            git commit -m "Update JEPX comparison charts"
            git push
          fi
