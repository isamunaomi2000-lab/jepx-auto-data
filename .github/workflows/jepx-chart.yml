name: JEPX Price Chart

on:
  workflow_dispatch:
  schedule:
    - cron: '45 23 * * *'

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create JEPX charts
        run: python scripts/create_jepx_chart.py

      - name: Commit charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/charts/
          if ! git diff --cached --quiet; then
            git commit -m "Update JEPX price charts"
            git push
          fi
