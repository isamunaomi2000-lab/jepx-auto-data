name: JEPX Price History

on:
  workflow_dispatch:
  schedule:
    - cron: '40 22 * * *'

permissions:
  contents: write

jobs:
  save-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Save JEPX history
        run: python scripts/save_jepx_history.py

      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jepx/history/
          if ! git diff --cached --quiet; then
            git commit -m "Update JEPX price history"
            git pull --rebase
            git push
          fi
