name: JEPX TEPCO Prediction

on:
  workflow_dispatch:
  schedule:
    - cron: '35 23 * * *'

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create TEPCO-adjusted prediction
        run: python scripts/predict_jepx_tepco.py

      - name: Commit predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions_tepco/
          if ! git diff --cached --quiet; then
            git commit -m "Update JEPX TEPCO predictions"
            git push
          fi
