name: TEPCO Forecast Daily

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tepco-daily.yml'
      - 'scripts/fetch_tepco.py'
  schedule:
    - cron: '0 22 * * *'
    - cron: '20 9 * * *'

permissions:
  contents: write

concurrency:
  group: tepco-forecast-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download TEPCO forecast data
        id: download
        continue-on-error: true
        run: python scripts/fetch_tepco.py

      - name: Save forecast data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tepco/
          if ! git diff --cached --quiet; then
            git commit -m "Update TEPCO forecast data"
            git pull --rebase
            git push
          fi
      - name: Report TEPCO source failures
        if: steps.download.outcome == 'failure'
        run: exit 1
