name: JEPX Prediction Evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * *'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Evaluate JEPX predictions
        run: python scripts/evaluate_jepx.py

      - name: Commit evaluation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evaluation/
          if ! git diff --cached --quiet; then
            git commit -m "Update JEPX prediction evaluation"
            git push
          fi
